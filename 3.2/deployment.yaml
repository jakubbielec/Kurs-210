kind: Deployment
apiVersion: apps/v1
metadata:
  name: html-openshift-app
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: html-openshift-app

  template:
    metadata:
      labels:
        app: html-openshift-app

    spec:
      containers:
      - name: html-openshift-app
        image: ghcr.io/jakubbielec/html-openshift-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP

---
kind: Service
apiVersion: v1
metadata:
  name: html-openshift-app
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app

spec:
  selector:
    app: html-openshift-app

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: html-openshift-app
  labels:
    app: html-openshift-app
    app.kubernetes.io/part-of: html-openshift-app

spec:
  to:
    kind: Service
    name: html-openshift-app

  port:
    targetPort: http

  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect